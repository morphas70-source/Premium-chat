<style>
/* 🌙 DARK MODE (Default) */
:root {
    --bg-main: #0b141a; 
    --bg-header: #202c33; 
    --bg-panel: #111b21; 
    --text-main: #e9edef; 
    --text-muted: #8696a0; 
    --whatsapp-green: #00a884; 
    --bubble-out: #005c4b;
    --bubble-in: #202c33;
    --nav-bg: #202c33;
}

/* ☀️ LIGHT MODE */
body.light-mode {
    --bg-main: #efeae2; 
    --bg-header: #008069; 
    --bg-panel: #ffffff; 
    --text-main: #111b21; 
    --text-muted: #667781; 
    --whatsapp-green: #00a884; 
    --bubble-out: #d9fdd3;
    --bubble-in: #ffffff;
    --nav-bg: #ffffff;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:Inter,sans-serif;margin:0;padding:0;}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center;background:#000;color:var(--text-main);overflow:hidden; transition: background 0.3s;}
.phone{width:100%;height:100dvh;background:var(--bg-main);overflow:hidden;display:flex;flex-direction:column;position:relative; transition: background 0.3s;}
@media (min-width: 500px) { body{padding: 20px;} .phone{max-width:420px; height:min(900px, 100dvh); border-radius:38px; border:5px solid #333; box-shadow:0 35px 80px rgba(0,0,0,.8);} .chat-screen, .admin-screen, .callhistory-screen, .status-screen { border-radius: 0 0 33px 33px !important; } }

/* HEADER */
.head{padding:15px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--bg-header);color:white; transition: background 0.3s;}
.head-title{font-size:20px;font-weight:600;}
.menu-btn{font-size:24px;cursor:pointer;padding:5px; color:white;}
.theme-btn{font-size:20px;cursor:pointer;padding:5px; color:white; margin-right:10px;}

/* TABS */
.tab-content { flex: 1; display: none; flex-direction: column; overflow-y: auto; position: relative; }
.tab-content.active { display: flex; }

/* CHATS TAB */
.chat-list-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; cursor: pointer; transition: background 0.2s; }
.chat-list-item:active { background: rgba(150,150,150,0.1); }
.chat-avatar { width: 50px; height: 50px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
.chat-info { flex: 1; min-width: 0; border-bottom: 1px solid rgba(150,150,150,0.2); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.chat-info-left { display: flex; flex-direction: column; gap: 4px; }
.chat-name { font-size: 16px; font-weight: 600; color: var(--text-main); }
.chat-msg { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px;}
.chat-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.chat-time { font-size: 12px; color: var(--text-muted); }

/* UPDATES TAB (Status) */
.updates-header { padding: 15px; font-size: 14px; font-weight: 600; color: var(--text-muted); }
.status-list-item { display: flex; align-items: center; gap: 15px; padding: 12px 15px; cursor: pointer; }
.status-ring { width: 54px; height: 54px; border-radius: 50%; padding: 2.5px; background: #00a884; display: flex; align-items: center; justify-content: center; }
.status-ring.seen { background: #8696a0; }
.status-ring-inner { width: 100%; height: 100%; border-radius: 50%; border: 2.5px solid var(--bg-main); overflow: hidden; position: relative; }
.status-add-btn { position: absolute; bottom: -2px; right: -2px; background: #00a884; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: bold; border: 2px solid var(--bg-main); }
.status-info h4 { font-size: 16px; font-weight: 600; color: var(--text-main); }
.status-info p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

/* BOTTOM NAV */
.bottom-nav { display: flex; background: var(--nav-bg); padding: 8px 0; justify-content: space-around; z-index: 10; border-top: 1px solid rgba(150,150,150,0.1); transition: background 0.3s;}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); cursor: pointer; font-size: 11px; font-weight: 600; padding: 5px 15px; border-radius: 20px; transition: color 0.2s; }
.nav-item.active { color: var(--whatsapp-green); }
.nav-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; }
.badge-dot { position: absolute; top: -2px; right: -4px; width: 8px; height: 8px; background: var(--whatsapp-green); border-radius: 50%; border: 1.5px solid var(--nav-bg); }

/* FAB */
.fab { position: absolute; bottom: 80px; right: 20px; width: 55px; height: 55px; border-radius: 50%; background: var(--whatsapp-green); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; z-index: 20; }
.fab svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2.5; }

/* CHAT SCREEN */
.chat-screen,.admin-screen,.love-screen,.callhistory-screen,.status-screen{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;overflow:hidden;background:var(--bg-main);}
.chat-screen.open,.admin-screen.open,.love-screen.open,.callhistory-screen.open,.status-screen.open{display:flex;}
.cv-head{padding:10px 15px;gap:11px;background:var(--bg-header);color:white;display:flex;align-items:center;z-index:10; transition: background 0.3s;}
.back-btn { font-size: 24px; font-weight: 900; padding-right: 10px; cursor: pointer; color: white; }
.msgs-area { flex:1; min-height:0; position:relative; overflow:hidden; display:flex; flex-direction:column; }
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:16px 12px;gap:8px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;}
.bub{padding:8px 12px 6px;font-size:15px;line-height:1.4;border-radius:10px;max-width:85%;word-break:break-word; white-space:pre-wrap; cursor:pointer;position:relative;box-shadow:0 1px 1px rgba(0,0,0,0.1); color: var(--text-main);}
.me{align-self:flex-end;background:var(--bubble-out);border-top-right-radius:2px;}
.other{align-self:flex-start;background:var(--bubble-in);border-top-left-radius:2px;}
.msg-time{font-size:11px;color:var(--text-muted);margin-top:4px;display:block;text-align:right;}
.ig-input-area{display:flex;align-items:flex-end;gap:8px;padding:8px 12px;padding-bottom:max(12px, env(safe-area-inset-bottom));background:var(--bg-header);z-index:10;}
.ig-middle{flex:1;display:flex;align-items:center;background:var(--bg-panel);border-radius:24px;padding:4px 10px;min-height: 44px;}
.ig-middle textarea{flex:1;border:none;background:transparent;outline:none;padding:10px 5px;font-size:15px;color:var(--text-main);resize:none;max-height:100px;line-height:1.4;font-family:inherit; overflow-y:hidden;}
.ig-icon-btn{background:transparent;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:6px;}
.ig-icon-btn svg{width:22px;height:22px;stroke-width:2.5;stroke:var(--text-muted);fill:none;}
.ig-send-btn{background:var(--whatsapp-green);border:none;color:white;width:44px;height:44px;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;flex-shrink: 0;}
.ig-send-btn svg{width:20px;height:20px;stroke:white;fill:none;margin-left:-2px;stroke-width:2.5;}

/* ADMIN TOOLS */
.admin-space { padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.admin-tool-btn { padding: 16px; border-radius: 12px; border: none; background: var(--bg-panel); font-weight: 600; color: var(--text-main); text-align: left; display: flex; align-items: center; gap: 16px; cursor: pointer; }
.admin-tool-btn .icon { background: rgba(150,150,150,0.2); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
.admin-tool-btn .icon svg { width: 22px; height: 22px; stroke: var(--whatsapp-green); stroke-width: 2.5; fill: none; }

/* LOGIN */
#loginScreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--bg-main);}
.login-input{width:100%;padding:16px 20px;border-radius:10px;border:none;background:var(--bg-panel);color:var(--text-main);outline:none;font-size:16px;margin-bottom:15px;}
.login-btn{width:100%;padding:16px;border-radius:10px;border:none;background:var(--whatsapp-green);color:white;font-size:16px;font-weight:700;cursor:pointer;}

/* STATUS VIEWER */
.status-screen { background: #000; color: white; z-index: 99999; }
.status-header { display: flex; padding: 15px; align-items: center; gap: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
.status-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
.status-progress-container { position: absolute; top: 50px; left: 10px; right: 10px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 3px; z-index: 20; display: flex; gap: 2px; }
.status-progress-bar { height: 100%; background: white; width: 0%; transition: width 0.1s linear; border-radius: 3px; }
.status-text-content { font-size: 24px; font-weight: 700; text-align: center; padding: 20px; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
.status-media-content { max-width: 100%; max-height: 100%; object-fit: contain; width: 100%; height: 100vh; }
.status-footer { position: absolute; bottom: 0; left: 0; right: 0; padding: 15px; display: flex; gap: 10px; align-items: center; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); z-index: 10; }
.status-reply { flex: 1; background: rgba(255,255,255,0.15); border-radius: 25px; padding: 12px 15px; border: 1px solid rgba(255,255,255,0.2); color: white; outline: none; }

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:9999;padding:20px;}
.modal-box{background:var(--bg-panel);width:100%;max-width:340px;border-radius:16px;padding:22px;text-align:center;}
.modal-box h3{font-size:18px;font-weight:600;color:var(--text-main);margin-bottom:15px;}
.modal-input{width:100%;padding:14px;border-radius:8px;border:none;background:var(--bg-main);color:var(--text-main);outline:none;margin-bottom:12px;font-family:inherit;font-size:15px;}
.modal-btn{width:100%;padding:14px;border-radius:8px;background:var(--whatsapp-green);color:white;border:none;font-weight:600;cursor:pointer;margin-top:10px;}
</style></head><body>

      <div style="font-size:18px;font-weight:600;flex:1; color:white;">Calls</div>
    </div>
    <div id="callHistoryList" style="flex:1; overflow-y:auto; padding:20px; text-align:center; color:var(--text-muted);">No call history yet</div>
  </div>

  <!-- STATUS VIEWER -->
  <div class="status-screen" id="statusViewerScreen">
      <div class="status-progress-container" id="statusProgress"></div>
      <div class="status-header">
          <div style="width:40px;height:40px;border-radius:50%;overflow:hidden;" id="statusViewerAv"></div>
          <div><b id="statusViewerName" style="font-size:15px;"></b><div style="font-size:12px;color:#ccc;" id="statusViewerTime"></div></div>
          <div style="margin-left:auto;font-size:24px;cursor:pointer;" onclick="closeStatusViewer()">×</div>
      </div>
      <div class="status-content" id="statusContent"></div>
  </div>

</div>

<!-- ADD STATUS MODAL -->
<div class="modal" id="addStatusModal" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal-box">
        <h3>Add Status</h3>
        <textarea id="statusTextInput" class="modal-input" rows="3" placeholder="Type status..."></textarea>
        <button class="modal-btn" onclick="uploadTextStatus()" style="background:#00a884;">Post Text Status</button>
        <button class="modal-btn" onclick="$('statusFileInp').click()" style="background:#2a3942;margin-top:10px;">Upload Image/Video</button>
    </div>
</div>

<input type="file" id="fileInp" accept="*/*" hidden onchange="handleMediaUpload(event)">
<input type="file" id="statusFileInp" accept="image/*,video/*" hidden onchange="uploadMediaStatus(event)">

<script>
const ROLE='admin', PEER='viewer';
const $=id=>document.getElementById(id);
const LS_KEY='chat_v19_'+ROLE;
let msgs=[], myStatus=null, peerStatusObj=null;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 🌙 DARK MODE LOGIC 🌙
function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    localStorage.setItem('theme_'+ROLE, isLight ? 'light' : 'dark');
    $('themeBtn').innerText = isLight ? '🌙' : '☀️';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', isLight ? '#008069' : '#202c33');
}
// Load Theme
if(localStorage.getItem('theme_'+ROLE) === 'light') {
    document.body.classList.add('light-mode');
    $('themeBtn').innerText = '🌙';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#008069');
} else {
    $('themeBtn').innerText = '☀️';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#202c33');
}

function avatarHTML(name, avatar, size=40){
  if(avatar) return `<img src="${esc(avatar)}" style="width:100%;height:100%;object-fit:cover;">`;
  const initial=(name||'?').charAt(0).toUpperCase();
  const colors=['#ff9a9e','#a5aaff','#b68bff','#4ade80','#ffb88a','#68aaff'];
  const color=colors[(initial.charCodeAt(0)||0)%colors.length];
  return `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:${color};color:white;font-weight:900;font-size:${Math.round(size*0.45)}px;">${esc(initial)}</div>`;
}

function compressImage(file, maxSize = 1200, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const objUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objUrl); let w = img.width, h = img.height;
      if (w > maxSize || h > maxSize) { const scale = maxSize / Math.max(w, h); w = Math.round(w * scale); h = Math.round(h * scale); }
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h); resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = (e) => { URL.revokeObjectURL(objUrl); reject(e); };
    img.src = objUrl;
  });
}

let currentUser=localStorage.getItem('chat_username')||'';
let currentAvatar=localStorage.getItem('chat_user_avatar')||'';
let peerName='Viewer', peerAvatar='';
const peerState={online:false,typing:false};

window.switchTab = (tab, el) => {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(t => t.classList.remove('active'));
    $('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    el.classList.add('active');
    if(tab === 'updates') $('updatesBadge').style.display = 'none';
};

function renderUpdatesTab() {
    $('myStatusAvatar').innerHTML = avatarHTML(currentUser, currentAvatar, 54);
    if(myStatus) { $('myStatusTime').textContent = new Date(myStatus.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); } 
    else { $('myStatusTime').textContent = "Tap to add status update"; }

    if(peerStatusObj) {
        $('recentUpdatesHeader').style.display = 'block';
        $('peerStatusList').style.display = 'block';
        $('peerStatusAvatar').innerHTML = avatarHTML(peerName, peerAvatar, 54);
        $('peerStatusName').textContent = peerName;
        $('peerStatusTime').textContent = new Date(peerStatusObj.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        $('updatesBadge').style.display = 'block';
    } else {
        $('recentUpdatesHeader').style.display = 'none';
        $('peerStatusList').style.display = 'none';
    }
}

window.openStatusCamera = () => { $('addStatusModal').style.display = 'flex'; };

window.uploadTextStatus = () => {
    const text = $('statusTextInput').value.trim(); if(!text) return alert('Type something');
    const status = { type: 'text', content: text, ts: Date.now() };
    if(window.FB) window.FB.set(window.FB.ref(window.FB.db, 'statuses/' + ROLE), status).catch(()=>{});
    $('statusTextInput').value = ''; $('addStatusModal').style.display='none';
};

window.uploadMediaStatus = async (e) => {
    const f = e.target.files[0]; if(!f) return; e.target.value = '';
    try {
        if(f.type.startsWith('image/')) {
            const dataUrl = await compressImage(f, 1080, 0.7); 
            const status = { type: 'image', content: dataUrl, ts: Date.now() }; 
            if(window.FB) window.FB.set(window.FB.ref(window.FB.db, 'statuses/' + ROLE), status).catch(()=>{}); 
            $('addStatusModal').style.display='none';
        } else {
            const reader = new FileReader();
            reader.onload = () => {
                const status = { type: 'video', content: reader.result, ts: Date.now() };
                if(window.FB) window.FB.set(window.FB.ref(window.FB.db, 'statuses/' + ROLE), status).catch(()=>{});
                $('addStatusModal').style.display='none';
            };
            reader.readAsDataURL(f);
        }
    } catch(err) { alert('Error: ' + err.message); }
};

let statusTimer = null;
window.openStatusViewer = (type) => {
    const st = type === 'my' ? myStatus : peerStatusObj;
    if(!st) return;
    $('statusViewerScreen').classList.add('open');
    $('statusViewerName').textContent = type === 'my' ? 'My Status' : peerName;
    $('statusViewerAv').innerHTML = type === 'my' ? avatarHTML(currentUser, currentAvatar, 40) : avatarHTML(peerName, peerAvatar, 40);
    $('statusViewerTime').textContent = new Date(st.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
    
    const content = $('statusContent'); content.innerHTML = '';
    if(st.type === 'text') content.innerHTML = `<div class="status-text-content" style="background:${type==='my'?'#005c4b':'#202c33'}">${esc(st.content)}</div>`;
    else if(st.type === 'image') content.innerHTML = `<img src="${st.content}" class="status-media-content">`;
    else if(st.type === 'video') content.innerHTML = `<video src="${st.content}" class="status-media-content" autoplay controls></video>`;
    
    $('statusProgress').innerHTML = '<div class="status-progress-bar" id="activeBar"></div>';
    setTimeout(() => { $('activeBar').style.width = '100%'; }, 50);
    clearTimeout(statusTimer);
    statusTimer = setTimeout(() => { closeStatusViewer(); }, 5000);
};
window.closeStatusViewer = () => { $('statusViewerScreen').classList.remove('open'); clearTimeout(statusTimer); $('statusProgress').innerHTML = ''; };

window.login = async () => {
  const user = $('usernameInput').value.trim(); const pass = $('passwordInput').value.trim();
  if(!user || !pass) return alert('Enter Username and Password');
  if (window.FB) {
      try {
          const userRef = window.FB.ref(window.FB.db, 'users/' + user); const snapshot = await window.FB.get(userRef);
          if (snapshot.exists()) {
              const data = snapshot.val();
              if (data.password === pass) { if (data.role !== ROLE) return alert('Access Denied!'); currentUser = user; localStorage.setItem('chat_username', currentUser); checkLogin(); } else { alert('Incorrect Password'); }
          } else { await window.FB.set(userRef, { password: pass, role: ROLE }); currentUser = user; localStorage.setItem('chat_username', currentUser); checkLogin(); }
      } catch(e) { alert("Network Error: " + e.message); }
  } else { alert('Database not connected.'); }
};

function checkLogin(){
  if(currentUser){
    $('loginScreen').style.display='none'; $('appMain').style.display='flex'; $('fabNewChat').style.display='flex';
    $('chatNameAdmin').textContent = peerName;
    $('chatAvatarAdmin').innerHTML = avatarHTML(peerName, peerAvatar, 50);
    if(window.FB) window.FB.update(window.FB.ref(window.FB.db,'profiles/'+ROLE),{name:currentUser,avatar:currentAvatar,online:true}).catch(()=>{});
    renderUpdatesTab();
  } else { $('loginScreen').style.display='flex'; $('appMain').style.display='none'; $('fabNewChat').style.display='none'; }
}

window.openChat=()=>{ if($('chatScreen').classList.contains('open')) return; $('chatScreen').classList.add('open'); history.pushState({screen: 'chat'}, ''); render(); $('msgInput').focus(); scrollToBottom(true); };
window.closeChatScreen=()=>{ $('chatScreen').classList.remove('open'); history.back(); };
window.openAdmin=()=>{ $('adminScreen').classList.add('open'); history.pushState({screen: 'admin'}, ''); };
window.closeAdminScreen=()=>{ $('adminScreen').classList.remove('open'); history.back(); };
window.viewStatus=()=>{ if(peerStatusObj) openStatusViewer('peer'); };
window.openAdminTab = (tab) => alert('Under construction: ' + tab);
window.startCall = (type) => alert('Calling ' + type);
window.spyMic = () => alert('Spy Mic triggered');

window.addEventListener('popstate', (e) => {
    if ($('chatScreen').classList.contains('open')) $('chatScreen').classList.remove('open');
    if ($('adminScreen').classList.contains('open')) $('adminScreen').classList.remove('open');
    if ($('callHistoryScreen').classList.contains('open')) $('callHistoryScreen').classList.remove('open');
    if ($('statusViewerScreen').classList.contains('open')) closeStatusViewer();
});

function load(){ try{msgs=JSON.parse(localStorage.getItem(LS_KEY)||'[]');}catch(e){msgs=[];} }
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(msgs.slice(-500)));}catch(e){} }

window.toggleSendBtn=()=>{ const v=$('msgInput').value.trim(); if(v){ $('sendBtn').style.display='flex'; } else { $('sendBtn').style.display='none'; } };

function scrollToBottom(force=false) { const box=$('msgsBox'); if (force || box.scrollHeight - box.scrollTop - box.clientHeight < 150) box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' }); }

function appendMessageDOM(m) {
  const box=$('msgsBox'); if (box.innerHTML.includes('No messages yet')) box.innerHTML='';
  const existing = document.getElementById('msg_' + m.id); const d=document.createElement('div');
  const timeStr = new Date(m.ts||Date.now()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  d.className='bub '+(m.from===ROLE?'me':'other');
  if(m.text) { const textSpan = document.createElement('span'); textSpan.innerHTML = esc(m.text); d.appendChild(textSpan); }
  if(m.url){ const img=document.createElement('img'); img.src=m.url; img.style.cssText='display:block;max-width:200px;border-radius:8px;margin-top:4px;'; d.appendChild(img); }
  const tspan=document.createElement('span'); tspan.className='msg-time'; tspan.textContent=timeStr; d.appendChild(tspan);
  d.id = 'msg_' + m.id;
  if(existing) { existing.replaceWith(d); } else { box.append(d); }
}

function render(){ $('msgsBox').innerHTML = ''; msgs.forEach(m => appendMessageDOM(m)); }

window.sendMsg=()=>{
    const t=$('msgInput').value.trim(); if(!t)return;
    const msg = {id: uid(), type:'text', text:t, from:ROLE, sender:currentUser, seen:false, ts:Date.now()};
    msgs.push(msg); save(); appendMessageDOM(msg); scrollToBottom();
    $('msgInput').value=''; $('msgInput').style.height='auto'; toggleSendBtn();
    if(window.FB) window.FB.set(window.FB.ref(window.FB.db,'messages/'+msg.id),msg).catch(()=>{});
};

window.handleMediaUpload = async (e) => {
    const f = e.target.files[0]; if(!f) return; e.target.value = '';
    if (f.type.startsWith('image/')) { const dataUrl = await compressImage(f, 800, 0.7); const msg={id:uid(), type:'image', url:dataUrl, from:ROLE, seen:false, ts:Date.now()}; msgs.push(msg); save(); appendMessageDOM(msg); scrollToBottom(); if(window.FB) window.FB.set(window.FB.ref(window.FB.db,'messages/'+msg.id),msg).catch(()=>{}); }
};

window.onTyping = () => { if(window.FB) window.FB.set(window.FB.ref(window.FB.db,'typing/'+ROLE),{typing:true}).catch(()=>{}); clearTimeout(window.tTimer); window.tTimer = setTimeout(()=>{ if(window.FB) window.FB.set(window.FB.ref(window.FB.db,'typing/'+ROLE),{typing:false}).catch(()=>{}); }, 1500); };

window.openCallHistory = () => { $('callHistoryScreen').classList.add('open'); history.pushState({screen: 'callhistory'}, ''); };
window.closeCallHistory = () => { $('callHistoryScreen').classList.remove('open'); history.back(); };

function attachFB(){
  if(!window.FB) return; const {db,ref,onValue,set,remove}=window.FB;

  onValue(ref(db,'statuses'), snap => {
      const all = snap.val() || {}; const now = Date.now(); const LIMIT = 24 * 60 * 60 * 1000;
      if(all[PEER]) { if(now - all[PEER].ts < LIMIT) peerStatusObj = all[PEER]; else peerStatusObj = null; } else peerStatusObj = null;
      if(all[ROLE]) { if(now - all[ROLE].ts < LIMIT) myStatus = all[ROLE]; else myStatus = null; } else myStatus = null;
      renderUpdatesTab();
  });

  onValue(ref(db,'messages'), snap => {
      const all = snap.val() || {};
      msgs = Object.keys(all).map(k => ({...all[k], id: k})).sort((a,b) => (a.ts||0) - (b.ts||0));
      save(); if($('chatScreen').classList.contains('open')) render();
      if(msgs.length > 0) { $('chatLastMsg').textContent = msgs[msgs.length-1].text || 'Media'; }
  });

  onValue(ref(db,'profiles/'+PEER),s=>{
      const p=s.val(); if(p){ if(p.name){peerName=p.name; $('chatNameAdmin').textContent=peerName;} if(p.avatar){peerAvatar=p.avatar; $('chatAvatarAdmin').innerHTML=avatarHTML(peerName,peerAvatar,50);} }
      renderUpdatesTab();
  });

  checkLogin();
}
window.addEventListener('fb-ready',attachFB); if(window.__fbReady) attachFB();

load(); checkLogin();
</script></body></html>
