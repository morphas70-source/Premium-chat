<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#fffaf5">
<title>Premium Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --pink:#ffb7d5; --purple:#b99aff; --blue:#92baff; --text:#201a35; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:Inter,sans-serif; margin:0; padding:0; }
body { min-height:100dvh; display:flex; justify-content:center; align-items:center; padding:12px; background:radial-gradient(ellipse at 5% 5%,#ffe6d9 0%,transparent 40%),radial-gradient(ellipse at 95% 15%,#d9c8ff 0%,transparent 40%),radial-gradient(ellipse at 50% 100%,#ffcfe4 0%,transparent 45%),linear-gradient(145deg,#f9edf8,#e9e6ff,#fff0e8); background-attachment:fixed; color:var(--text); }
.phone { width:100%; max-width:420px; height:min(900px,calc(100dvh - 24px)); min-height:580px; background:rgba(255,250,250,.84); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-radius:38px; border:5px solid rgba(255,255,255,.98); box-shadow:0 35px 80px rgba(91,60,130,.22); overflow:hidden; display:flex; flex-direction:column; position:relative; }
.head { padding:24px 20px 14px; gap:14px; display:flex; align-items:center; }
.app-ic { width:52px; height:52px; border-radius:16px; background:linear-gradient(145deg,#fff,#f8dfff,#d9d7ff); border:3px solid white; box-shadow:0 7px 0 #e3d3ef,0 12px 25px rgba(130,80,170,.18); display:flex; justify-content:center; align-items:center; }
.app-ic::before { content:''; width:28px; height:22px; border-radius:12px 12px 12px 4px; background:linear-gradient(135deg,#ffb8d4,#d2a1ff,#91baff); box-shadow:0 4px 0 rgba(100,60,130,.15); }
.head-title { font-size:26px; font-weight:800; letter-spacing:-1px; }
.auth-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; }
.auth-screen h2 { font-size:24px; font-weight:800; margin-bottom:10px; }
.auth-screen p { font-size:13px; color:#666; margin-bottom:30px; font-weight:600; text-align:center; }
.auth-inp { width:100%; max-width:300px; padding:16px; border-radius:20px; border:3px solid white; background:rgba(255,255,255,.7); outline:none; font-size:15px; font-weight:700; box-shadow:inset 0 2px 8px rgba(100,65,130,.05),0 8px 0 #e8dbe9; margin-bottom:20px; transition:.2s; }
.auth-inp:focus { background:white; box-shadow:inset 0 2px 8px rgba(100,65,130,.05),0 8px 0 #d2b9e9; }
.auth-btn { width:100%; max-width:300px; padding:16px; border-radius:20px; border:3px solid white; background:linear-gradient(145deg,#a5aaff,#b68bff,#e5a6f7); color:white; font-size:16px; font-weight:800; cursor:pointer; box-shadow:0 8px 0 #9983d9,0 14px 28px rgba(95,65,130,.2); transition:transform .15s ease; }
.auth-btn:active { transform:translateY(5px) scale(.97); box-shadow:0 3px 0 #9983d9; }
#mainHome { flex:1; overflow-y:auto; display:none; flex-direction:column; padding-bottom:10px; }
.profile { margin:4px 15px; padding:16px 14px; gap:14px; background:linear-gradient(135deg,rgba(255,225,224,.95),rgba(255,238,232,.95),rgba(242,220,255,.9)); border:3px solid white; border-radius:24px; box-shadow:0 8px 0 #e9d0e5,0 16px 30px rgba(100,65,130,.15); display:flex; align-items:center; cursor:pointer; }
.p-av { width:68px; height:68px; border:3px solid white; box-shadow:0 5px 0 #e7bdd6; border-radius:50%; overflow:hidden; flex-shrink:0; display:flex; justify-content:center; align-items:center; background:#ffe4d6; font-size:26px; position:relative; }
.p-name { font-size:17px; font-weight:800; }
.p-on { font-size:11px; font-weight:700; color:#289b65; }
.logout-btn { margin-left:auto; padding:6px 12px; background:#ff6b6b; color:white; border:2px solid white; border-radius:12px; font-size:10px; font-weight:800; cursor:pointer; box-shadow:0 4px 0 #d94a4a; }
.q-head { margin:25px 19px 0; font-size:21px; font-weight:800; letter-spacing:-.7px; }
.quick { margin:16px 15px 20px; gap:14px; display:grid; grid-template-columns:1fr 1fr; }
.qc { min-height:132px; padding:20px 10px 15px; gap:14px; border:3px solid white; border-radius:25px; box-shadow:0 8px 0 rgba(105,75,140,.14),0 16px 30px rgba(100,65,145,.15); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; }
.qc:nth-child(1){background:linear-gradient(145deg,#dfc6ff,#b98aff,#d7a8ff)}.qc:nth-child(2){background:linear-gradient(145deg,#c4d8ff,#88a8ff,#a8b5ff)}
.qc:active { transform:translateY(5px) scale(.97); }
.q3d { width:64px; height:52px; border-radius:17px; box-shadow:0 7px 0 rgba(90,60,130,.17); display:flex; justify-content:center; align-items:center; background:linear-gradient(135deg,#f0b0ff,#e090ff); }
.q3d svg { width:28px; height:28px; stroke:white; }
.qc b { font-size:13px; font-weight:800; color:#29213d; }
.chat-screen { position:absolute; inset:0; z-index:10; display:none; flex-direction:column; background:radial-gradient(ellipse at top right,#f3e5ff,transparent 45%),linear-gradient(145deg,#fffafc,#fff5ee); border-radius:31px; }
.chat-screen.open { display:flex; }
.cv-head { padding:17px 15px; gap:11px; background:rgba(255,255,255,.85); border-bottom:2px solid #f0e2f4; display:flex; align-items:center; }
.back { flex-shrink:0; width:40px; height:40px; background:linear-gradient(145deg,#fff,#f0dfff); box-shadow:0 4px 0 #e0cce9; border:2px solid white; border-radius:50%; display:flex; justify-content:center; align-items:center; cursor:pointer; font-weight:800; }
.msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; padding:16px 12px; gap:13px; background-color:#fff9fc; background-image:radial-gradient(rgba(205,170,230,.25) 1px,transparent 1px); background-size:20px 20px; }
.bub { padding:12px 15px; font-size:13px; line-height:1.5; border:2px solid white; border-radius:19px; box-shadow:0 5px 12px rgba(100,65,130,.09); max-width:85%; font-weight:600; word-break:break-word; position:relative; }
.me { align-self:flex-end; background:linear-gradient(135deg,#ffe0ec,#edceff); border-bottom-right-radius:5px; color:#333; }
.other { align-self:flex-start; background:linear-gradient(145deg,#fff,#f7efff); border-bottom-left-radius:5px; color:#333; }
.sender-name { font-size: 10px; color: #888; margin-bottom: 4px; display: block; }
.seen-tick { font-size:10px; margin-left:5px; float:right; margin-top:5px; color: #4ade80; }
.input { padding:10px; gap:8px; background:rgba(255,255,255,.95); border-top:2px solid #f0e2f4; display:flex; align-items:center; position:relative; }
.input input { flex:1; outline:none; background:#f8f1fb; border:2px solid white; border-radius:22px; padding:13px 15px; font-size:13px; }
.send { flex-shrink:0; width:44px; height:44px; background:linear-gradient(145deg,#a5aaff,#b68bff,#e5a6f7); color:white; border:none; border-radius:50%; cursor:pointer; display:flex; justify-content:center; align-items:center; font-size:20px; box-shadow:0 4px 0 rgba(0,0,0,.1); }
</style>
</head><body>

<div class="phone">
  <div class="head"><div class="app-ic"></div><div class="head-title">Premium Chat</div></div>

  <!-- LOGIN SCREEN -->
  <div id="authScreen" class="auth-screen">
    <h2>Welcome</h2>
    <p>Enter your name to start</p>
    <input type="text" id="loginName" class="auth-inp" placeholder="Your Name..." onkeydown="if(event.key==='Enter') App.login()">
    <button type="button" class="auth-btn" onclick="App.login()">Enter</button>
  </div>

  <!-- HOME SCREEN -->
  <div id="mainHome">
    <div class="profile">
      <div class="p-av" id="userAvatar">👤</div>
      <div><div class="p-name" id="myNameDisplay">User</div><div class="p-on">Online</div></div>
      <button type="button" class="logout-btn" onclick="App.logout()">Logout</button>
    </div>
    
    <div class="q-head">Start Chat</div>
    <div class="quick">
      <div class="qc" onclick="App.openChat()"><div class="q3d"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><b>Messages</b></div>
    </div>
  </div>

  <!-- CHAT SCREEN -->
  <div class="chat-screen" id="chatScreen">
    <div class="cv-head">
      <div class="back" onclick="document.getElementById('chatScreen').classList.remove('open')">←</div>
      <div style="width:40px;height:40px;border-radius:50%;overflow:hidden;background:#ffe4d6;display:flex;justify-content:center;align-items:center;font-size:20px">💬</div>
      <div style="flex:1;min-width:0"><b>Private Chat</b><div style="font-size:11px;color:#4ade80">Live</div></div>
    </div>
    <div class="msgs" id="msgsBox"></div>
    <div class="input">
      <input id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')App.sendMsg()">
      <button type="button" class="send" onclick="App.sendMsg()">➤</button>
    </div>
  </div>
</div>

<!-- FIREBASE LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA105KJhAOQxigwc5iltil-aFnz7ykruwI",
  authDomain: "love-space-3e574.firebaseapp.com",
  databaseURL: "https://love-space-3e574-default-rtdb.firebaseio.com",
  projectId: "love-space-3e574",
  storageBucket: "love-space-3e574.firebasestorage.app",
  messagingSenderId: "9834363623",
  appId: "1:9834363623:web:829d60de594b3e7c850042"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const App = (()=>{
  let myName = localStorage.getItem('private_chat_name') || '';
  let isChatOpen = false;

  // LOGIN
  function login(){
    const name = document.getElementById('loginName').value.trim();
    if(!name) return alert('Please enter your name');
    
    myName = name;
    localStorage.setItem('private_chat_name', myName);
    showMain();
  }

  function logout(){
    localStorage.removeItem('private_chat_name');
    location.reload();
  }

  // UI NAVIGATION
  function showMain(){
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainHome').style.display = 'flex';
    document.getElementById('myNameDisplay').textContent = myName;
    document.getElementById('userAvatar').textContent = myName.charAt(0).toUpperCase();
  }

  // CHAT LOGIC
  function openChat(){
    isChatOpen = true;
    document.getElementById('chatScreen').classList.add('open');
    
    const msgsBox = document.getElementById('msgsBox');
    msgsBox.innerHTML = ''; // Clear old messages on UI
    
    // Listen to Database (Only adding new messages)
    const chatRef = ref(db, 'private_chats/room1');
    
    // To prevent duplicate messages on reload, we can clear UI and load all
    // For simplicity, we just listen to new ones
    onChildAdded(chatRef, (snapshot) => {
      const msg = snapshot.val();
      renderMsg(msg);
    });
  }

  function sendMsg(){
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if(!text) return;

    const chatRef = ref(db, 'private_chats/room1');
    push(chatRef, {
      sender: myName,
      text: text,
      ts: serverTimestamp()
    });

    input.value = '';
  }

  function renderMsg(msg){
    const msgsBox = document.getElementById('msgsBox');
    const d = document.createElement('div');
    d.className = 'bub ' + (msg.sender === myName ? 'me' : 'other');
    
    if(msg.sender !== myName){
      const nameLabel = document.createElement('span');
      nameLabel.className = 'sender-name';
      nameLabel.textContent = msg.sender;
      d.appendChild(nameLabel);
    }

    d.appendChild(document.createTextNode(msg.text));
    
    if(msg.sender === myName){
      const tick = document.createElement('span');
      tick.className = 'seen-tick';
      tick.textContent = '✓';
      d.appendChild(tick);
    }

    msgsBox.appendChild(d);
    msgsBox.scrollTop = msgsBox.scrollHeight; // Auto scroll
  }

  // Check if already logged in
  if(myName) {
    showMain();
  }

  return { login, logout, openChat, sendMsg };
})();
window.App = App;
</script>
</body></html>
